version: '3.9'

services:

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - APP_ENV=development
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=pass
      - DB_NAME=atlas
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_SLICES=slices
      - MINIO_USE_SSL=false
      - MEILISEARCH_URL=http://meilisearch:7700
      - JWT_SECRET=your_secret_key
    depends_on:
      - postgres
      - redis
      - minio
      - meilisearch
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=pass
      - DB_NAME=atlas
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_SLICES=slices
      - MINIO_USE_SSL=false
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: atlas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.7
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  frontend-public:
    build:
      context: ./web/public
      dockerfile: ../../docker/frontend-public.Dockerfile
    volumes:
      - public_dist:/app/dist

  frontend-admin:
    build:
      context: ./web/admin
      dockerfile: ../../docker/frontend-admin.Dockerfile
    volumes:
      - admin_dist:/app/dist

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
      - "3010:3000"
      - "3011:3001"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - public_dist:/usr/share/nginx/html/public:ro
      - admin_dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - api
      - frontend-public
      - frontend-admin
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meili_data:
  public_dist:
  admin_dist:
